description: Script Bash Example

tasks:
  - task: script.bash
    pwd: ${PROJECT_PATH}
    commands:
      - git
    source: |
      echo "Check if git project"
      if [ ! -d ".git" ]; then
        echo "Not a git project"
        exit 1
      fi

      echo "Get branch name"
      branch=$(git branch --show-current)
      echo "Branch name: $branch"

      BRANCH_NAME=$(echo $branch | tr '/' '_')
      echo "#[setVariable 'BRANCH_NAME';]$BRANCH_NAME"

  - task: script.bash
    source: |
      echo "Branch name: $BRANCH_NAME"
